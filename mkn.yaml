#! clean build -dtO

name: conan.install
version: master

parent: base
src: mod.cpp
mode: shared

profile:
- name: base
  with: mkn.mod
  if_dep:  # Windows modules share yaml-cpp as a DLL, -K can't make it static
    bsd: parse.yaml[lib]
    win: parse.yaml[shared]
  if_arg:
    shared: -DMKN_KUL_SHARED

- name: test
  parent: base
  main: test.cpp
  if_dep:
    nix: parse.yaml[lib]

- name: format
  mod: |
    clang.format{init:{style: google, paths: .}}
