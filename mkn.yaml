#! clean build -dtO

name: conan.install
property:
  # dependency versions: master on master, latest on latest (a bare dep is the default branch)
  mkn.mod.version: latest
version: master

parent: base
src: mod.cpp
mode: shared

profile:
- name: base
  with: mkn.mod#${mkn.mod.version}
  if_arg:
    shared: -DMKN_KUL_SHARED

- name: test
  parent: base
  main: test.cpp

- name: format
  mod: |
    clang.format#latest{init:{style: google, paths: .}}
