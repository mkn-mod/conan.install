#! clean build -dtO

name: conan.install
version: master

parent: base
src: mod.cpp
mode: shared

profile:
- name: base
  with: mkn.mod
  if_dep:
    bsd: parse.yaml[lib]
    win: parse.yaml[lib]
  if_arg:
    shared: -DMKN_KUL_SHARED
    win: -DYAML_CPP_STATIC_DEFINE

- name: test
  parent: base
  main: test.cpp
  dep: parse.yaml[lib]
  if_arg:
    win: -DYAML_CPP_STATIC_DEFINE

- name: format
  mod: |
    clang.format{init:{style: google, paths: .}}
